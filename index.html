/* ===== FCM PUSH NOTIFICATIONS =====
   Web FCM works on HTTPS and needs firebase-messaging-sw.js at the site root.
   For the Android APK, the native wrapper can set window.GZA_FCM_TOKEN; this
   page will save that token to the same Firebase user record automatically.
*/
let gzaMessaging=null;
let gzaFcmStartedFor="";
async function gzaSaveFcmToken(token){
  if(!token||!currentUser?.uid)return;
  try{
    await db.ref("users/"+currentUser.uid).update({fcmToken:String(token),fcmTokenUpdatedAt:Date.now()});
    if(cache.users?.[currentUser.uid]){
      cache.users[currentUser.uid].fcmToken=String(token);
      cache.users[currentUser.uid].fcmTokenUpdatedAt=Date.now();
    }
  }catch(e){console.warn("FCM token save failed",e);}
}
async function gzaInitFCM(){
  const uid=String(currentUser?.uid||"");
  if(!uid||gzaFcmStartedFor===uid)return;
  gzaFcmStartedFor=uid;
  try{
    if(window.GZA_FCM_TOKEN) await gzaSaveFcmToken(window.GZA_FCM_TOKEN);
    if(!firebase.messaging || !window.isSecureContext) return;
    if(!("Notification" in window)) return;
    if(Notification.permission==="denied") return;
    const permission=Notification.permission==="granted" ? "granted" : await Notification.requestPermission();
    if(permission!=="granted")return;
    if(!navigator.serviceWorker)return;
    const registration=await navigator.serviceWorker.register("/firebase-messaging-sw.js");
    gzaMessaging=firebase.messaging();
    const token=await gzaMessaging.getToken({serviceWorkerRegistration:registration});
    if(token)await gzaSaveFcmToken(token);
    gzaMessaging.onMessage(payload=>{
      const n=payload?.notification||{};
      const title=n.title||payload?.data?.title||"GEN Z ARENA";
      const body=n.body||payload?.data?.body||"New notification";
      try{gzaNotify(title+" — "+body,"info");}catch(_){}
    });
  }catch(e){console.warn("FCM initialization skipped/failed",e);}
}

  return String(v ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")

}

async function submitAuth(ev){
  ev.preventDefault();
  const email=document.getElementById("authEmail")?.value.trim()||"";
  const password=document.getElementById("authPassword")?.value||"";
  if(!email||password.length<6){showAuth(authMode,"Please enter a valid email and a password of at least 6 characters.");return;}
  try{
    if(authMode==="signup"){
      const name=document.getElementById("authName")?.value.trim()||"";
      const ign=document.getElementById("authIgn")?.value.trim()||"";
      const gameUid=document.getElementById("authGameUid")?.value.trim()||"";
      const password2=document.getElementById("authPassword2")?.value||"";
      if(!name||!ign||!gameUid){showAuth("signup","Please fill all player details.");return;}
      if(password!==password2){showAuth("signup","Passwords do not match.");return;}
      const cred=await auth.createUserWithEmailAndPassword(email,password);
      const now=Date.now();
      const referralCode="GZA"+String(Math.random().toString(36).slice(2,8)).toUpperCase();
      const userData={name,email,ign,inGameName:ign,gameUid,inGameUid:gameUid,role:"user",status:"active",coins:0,referralCode,createdAt:now,updatedAt:now};
      await db.ref("users/"+cred.user.uid).set(userData);
      currentUser=cred.user;
      renderCurrent();
    }else{
      const cred=await auth.signInWithEmailAndPassword(email,password);
      currentUser=cred.user;
      const u=await getUserRecord(cred.user.uid);
      if(isPrivilegedUser(u)){
        await auth.signOut();
        currentUser=null;
        showAuth("login","This account cannot be used here.");
        return;
      }
      renderCurrent();
    }
  }catch(e){
    console.warn("User authentication error",e);
    const code=String(e?.code||"");
    let msg="Unable to complete this request. Please check your details and try again.";
    if(code.includes("email-already-in-use"))msg="This email is already registered. Please login.";
    else if(code.includes("invalid-credential")||code.includes("wrong-password")||code.includes("user-not-found"))msg="Email or password is incorrect.";
    else if(code.includes("invalid-email"))msg="Please enter a valid email address.";
    else if(code.includes("weak-password"))msg="Please use a stronger password.";
    showAuth(authMode,msg);
  }
}

async function startAuth(){

function copyRoomValue(value){
  const text=String(value||"");
  if(!text){gzaNotify("Nothing to copy.","error");return;}
  const done=()=>gzaNotify("Copied successfully.","success");
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>copyRoomFallback(text,done));
  }else copyRoomFallback(text,done);
}
function copyRoomFallback(text,done){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");done();}catch(_){gzaNotify("Copy failed. Please copy manually.","error");}
  ta.remove();
}

function gzaRestoreLastRoute(){
  try{
    const raw=localStorage.getItem("gza_last_route");
    if(!raw)return false;
    const r=JSON.parse(raw);
    const fn=window[r?.name];
    if(!r?.name || typeof fn!=="function")return false;
    localStorage.removeItem("gza_last_route");
    gzaHistoryNavigatingBack=true;
    try{
      gzaRouteStack=[{name:r.name,args:Array.isArray(r.args)?r.args:[],key:gzaRouteKey(r.name,r.args||[])}];
      fn.__gzaOriginal ? fn.__gzaOriginal.apply(window,r.args||[]) : fn.apply(window,r.args||[]);
    }finally{gzaHistoryNavigatingBack=false;}
    return true;
  }catch(_){return false;}

let gzaCountdownInterval=null;
function gzaStartCountdown(t){
  if(gzaCountdownInterval) clearInterval(gzaCountdownInterval);
  const el=document.getElementById("gzaTimer");
  if(!el)return;
  const raw=t.startAt||t.startDateTime||t.dateTime||t.date||t.time;
  let target=NaN;
  if(typeof raw==="number") target=raw;
  else if(raw) target=Date.parse(String(raw).replace(" ","T"));
  if(Number.isNaN(target)){
    el.textContent=t.timeLeft||"—";
    return;
  }
  const tick=()=>{
    const diff=target-Date.now();
    if(diff<=0){
      el.textContent="00:00:00";
      clearInterval(gzaCountdownInterval);
      return;
    }
    const total=Math.floor(diff/1000),d=Math.floor(total/86400),h=Math.floor(total%86400/3600),m=Math.floor(total%3600/60),s=total%60;
    el.textContent=(d?String(d).padStart(2,"0")+":":"")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  };
  tick();
  gzaCountdownInterval=setInterval(tick,1000);
}

  const byPosition={};
  joined.forEach(p=>{

  return Array.from({length:Math.max(1,totalSlots)},(_,i)=>{
    const n=i+1;
    const p=byPosition[String(n)];
    if(p){

async function confirmJoin(){
  if(!currentTournament || !selectedPosition || !gameName || !gameId)return;
  if(!currentUser){
    gzaNotify("Please login before joining.","error");
    return;
  }
  if(userIsBlocked()){
    gzaNotify("Your account is blocked.","error");
    return;
  }

  const tid=String(currentTournament.id);
  const u=currentUserData();
  const balance=Number(u.coins||0);
  const entry=Number(currentTournament.fee||currentTournament.entryFee||currentTournament.entryCoins||0);

  if(entry<0){
    gzaNotify("Invalid entry coin value.","error");
    return;
  }
  if(entry>0 && balance<entry){
    gzaNotify(`Insufficient coins. Required: ${entry} 🪙 | Available: ${balance} 🪙`,"error");
    wallet();
    return;
  }

  const existing=joinedForTournament(tid).find(
    p=>String(p.userId||p.uid||"")===String(currentUser.uid)
  );
  if(existing){
    gzaNotify("You are already joined in this tournament.","info");
    return;
  }

  const limit=Number(currentTournament.limit||currentTournament.playerLimit||currentTournament.slots||0);
  if(limit && joinedForTournament(tid).length>=limit){
    gzaNotify("All slots are filled.","info");
    positions();
    return;
  }

  const occupied=joinedForTournament(tid).some(
    p=>String(p.position||p.slot||"")===String(selectedPosition)
  );
  if(occupied){
    gzaNotify("This position is already joined.","info");
    positions();
    return;
  }

  const now=Date.now();
  const joinData={
    userId:currentUser.uid,
    uid:currentUser.uid,
    tournamentId:tid,
    tournamentName:tournamentName(currentTournament),
    categoryId:currentTournament.categoryId||currentTournament.category||currentCategoryId||"",
    inGameName:gameName,
    ign:gameName,
    inGameUid:gameId,
    uidGame:gameId,
    position:selectedPosition,
    slot:selectedPosition,
    team:selectedTeam,
    teamName:`Team ${selectedTeam}`,
    entryCoins:entry,
    entryType:"coins",
    nonCash:true,
    status:"joined",
    createdAt:now,
    joinedAt:now
  };

  let debited=false;
  try{
    // Atomic wallet debit. The transaction prevents two simultaneous joins
    // from spending the same coins.
    if(entry>0){
      const walletRef=db.ref("users/"+currentUser.uid+"/coins");
      const tx=await walletRef.transaction(currentCoins=>{
        const n=Number(currentCoins||0);
        if(n<entry)return;
        return n-entry;
      });
      if(!tx.committed){
        gzaNotify("Insufficient coins. Your wallet balance was not changed.","error");
        return;
      }
      debited=true;
      const newBalance=Number(tx.snapshot.val()||0);
      if(cache.users?.[currentUser.uid]){
        cache.users[currentUser.uid].coins=newBalance;
      }
    }

    const newRef=db.ref("tournamentParticipants").push();
    await newRef.set(joinData);

    const historyRef=db.ref("joinHistory").push();
    await historyRef.set({
      ...joinData,
      joinId:newRef.key,
      historyType:"match_join",
      balanceAfter:entry>0 ? Number(cache.users?.[currentUser.uid]?.coins||0) : balance
    });

    if(entry>0){
      await db.ref("coinTransactions").push({
        uid:currentUser.uid,type:"match_join",amount:-entry,
        balanceAfter:Number(cache.users?.[currentUser.uid]?.coins||0),
        tournamentId:tid,tournamentName:tournamentName(currentTournament),
        joinId:newRef.key,createdAt:now
      });
    }

    gzaNotify(`Tournament joined successfully. ${entry>0?entry+" coins deducted from your wallet.":""}`,"success");
    selectedPosition=null;
    selectedTeam="";
    gameName="";
    gameId="";
    // GEN Z ARENA FIX: after a successful join, go straight to Home instead
    // of back into the tournament details page.
    home();
  }catch(e){
    console.error(e);

    // If the wallet was debited but participant/history creation failed,
    // restore exactly the entry amount.
    if(debited && entry>0){
      try{
        const walletRef=db.ref("users/"+currentUser.uid+"/coins");
        await walletRef.transaction(currentCoins=>Number(currentCoins||0)+entry);
        if(cache.users?.[currentUser.uid]){
          cache.users[currentUser.uid].coins=Number(cache.users[currentUser.uid].coins||0)+entry;
        }
      }catch(refundError){
        console.error("Wallet refund failed:",refundError);
      }
    }

    gzaNotify("Join failed. Your wallet was not charged if the join could not be completed.","error");
  }
}

async function buySubscription(id){
  if(!currentUser){showAuth("login","Please login first.");return;}
  const p=cache.subscriptions?.[id];
  if(!p){alert("Subscription plan is not available right now.");return;}
  const price=Number(p.priceCoins ?? p.coinsPrice ?? p.price ?? 0);
  const days=Number(p.days||0);
  if(price<0 || !Number.isFinite(price)){alert("Subscription plan is not configured correctly.");return;}
  if(days<=0){alert("Subscription duration is not configured.");return;}
  const userRef=db.ref("users/"+currentUser.uid);
  try{
    let newBalance=0;
    await userRef.transaction(u=>{
      if(!u)return u;
      const balance=Number(u.coins||0);
      if(balance<price)return;
      newBalance=balance-price;
      return {...u,coins:newBalance,subscription:"active",subscriptionStatus:"active",isSubscribed:true,subscribed:true,subscriptionPlan:p.name||"Premium Plan",subscriptionStartedAt:Date.now(),subscriptionExpiresAt:Date.now()+days*86400000,updatedAt:Date.now()};
    });
    const snap=await userRef.once("value");
    const fresh=snap.val()||{};
    if(Number(fresh.coins||0)!==newBalance || statusNorm(fresh.subscriptionStatus)!=="active"){
      alert("Not enough coins or the subscription could not be activated.");return;
    }
    await db.ref("coinTransactions").push({uid:currentUser.uid,type:"subscription",amount:-price,balanceAfter:newBalance,planId:id,planName:p.name||"Premium Plan",createdAt:Date.now()});
    alert("Subscription activated successfully.");
    subscription();
  }catch(e){console.warn("Subscription purchase error",e);alert("Subscription could not be activated. Please try again.");}
}

function transactionHistory(){
  if(!currentUser){showAuth("login","Please login first.");return;}
  const uid=String(currentUser.uid);
  const rows=[];
  const seen=new Set();
  const add=(key,row)=>{
    if(!row || String(row.uid||row.userId||row.playerUid||"")!==uid)return;
    if(seen.has(key))return;
    seen.add(key); rows.push(row);
  };

  // Primary wallet ledger written by wallet-related actions/backend.
  values("coinTransactions").forEach(r=>add("ct:"+r.id,{...r,_source:"ledger"}));

  // Include withdrawal requests when a separate ledger row is not present.
  values("withdrawalRequests").forEach(r=>add("wd:"+(r.requestId||r.id),{
    ...r,type:"withdrawal",amount:-Math.abs(Number(r.amount||0)),_source:"withdrawal"
  }));

  // Include match entries from join history when no ledger row exists.
  values("joinHistory").forEach(r=>{
    const amount=Number(r.entryCoins||r.entryFee||0);
    if(amount>0)add("join:"+(r.joinId||r.id),{
      ...r,type:"match_join",amount:-amount,_source:"joinHistory",
      balanceAfter:r.balanceAfter
    });
  });

  // Verified result records are shown as winning rewards.
  values("results").forEach(r=>{
    const reward=Number(r.prize||r.winningCoins||0);
    if(reward>0)add("win:"+r.id,{...r,type:"winning",amount:reward,_source:"results"});
  });

  rows.sort((a,b)=>Number(b.createdAt||b.updatedAt||b.joinedAt||0)-Number(a.createdAt||a.updatedAt||a.joinedAt||0));
  const html=rows.length?rows.map(r=>{
    const amount=Number(r.amount||0);
    const positive=amount>=0;
    const status=r.status?String(r.status):"completed";
    const statusText=statusNorm(r.type)==="withdrawal"?withdrawalStatusLabel(status):String(status).toUpperCase();
    const when=r.createdAt||r.updatedAt||r.joinedAt;
    const title=transactionTypeLabel(r.type);
    const ref=r.orderId||r.requestId||r.transactionId||r.joinId||r.id||"—";
    return `<div class="gza-tx-row">
      <div class="gza-tx-icon">${positive?"➕":"➖"}</div>
      <div class="gza-tx-main">
        <div class="gza-tx-top"><b>${esc(title)}</b><strong class="gza-tx-amount ${positive?"plus":"minus"}">${positive?"+":""}${amount} 🪙</strong></div>
        <div class="gza-tx-meta">${esc(String(r.description||r.planName||r.tournamentName||r.methodLabel||"")||"Wallet transaction")}</div>
        <div class="gza-tx-meta">${when?esc(new Date(Number(when)).toLocaleString()):""} · ${esc(statusText)}</div>
        <div class="gza-tx-ref">ID: ${esc(ref)}</div>
      </div>
    </div>`;
  }).join(""):"<div class=\"muted\" style=\"padding:12px 0\">No transaction history available yet.</div>";

  document.getElementById("app").innerHTML=`
    ${innerHeader("Transaction History")}
    <div class="simple-page">
      <div class="simple-card">
        <h3>📜 Wallet Transaction History</h3>
        <p class="muted" style="margin-top:7px">Your wallet entries, rewards, withdrawals and other coin activity.</p>
        <div style="margin-top:12px">${html}</div>
      </div>
    </div>${bottom()}`;
}

// TEMP DEBUG + FIX: if the ZapUPI payment screen fully navigates away
// (instead of firing onSuccess/onFailure in-page), we lose the JS callback
// entirely. So we remember the pending order in localStorage BEFORE opening
// the payment screen, and resume checking its status whenever the deposit
// page is opened again (e.g. user comes back after paying).
function gzaResumePendingDeposit(){
  try{
    const raw=localStorage.getItem("gza_pending_deposit");
    if(!raw) return;
    const pending=JSON.parse(raw);
    if(!pending || !pending.orderId) return;
    if(Date.now()-pending.ts > 30*60*1000){ localStorage.removeItem("gza_pending_deposit"); return; } // older than 30 min, ignore
    const statusBox=document.getElementById("depositStatusBox");
    if(!statusBox) return;
    gzaDebugLog("RESUME: found pending order in storage, resuming status check for "+pending.orderId);
    statusBox.innerHTML = gzaSpinner("Resuming check for your last payment...");
    pollDepositStatus(pending.orderId, statusBox);
  }catch(e){ gzaDebugLog("RESUME failed: "+(e?.message||e)); }
}

    // STEP 1: ask OUR backend to reserve a pending order (never generate
    // order_id or credit coins on the client — see wallet-deposit.js)
    gzaDebugLog("STEP1: calling create-order at "+WALLET_API_BASE+"/create-order");
    const res = await fetch(`${WALLET_API_BASE}/create-order`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ uid: currentUser.uid, amount })
    });
    const data = await res.json();
    gzaDebugLog("STEP1 response: "+JSON.stringify(data));

    if(!data.success){
      statusBox.innerHTML = `<p style="color:#ef7479">${data.message || "Could not create order."}</p>`;
      return;
    }

    const orderId = data.order_id;
    localStorage.setItem("gza_pending_deposit", JSON.stringify({orderId, amount, ts: Date.now()}));
    statusBox.innerHTML = gzaSpinner("Please wait, opening payment...");

    // STEP 2: set what happens after the ZapUPI payment screen closes
    ZapUPI.setPaymentCallbacks({
      onSuccess: function(returnedOrderId){
        gzaDebugLog("ZapUPI onSuccess fired. returnedOrderId="+returnedOrderId);
        // This does NOT mean coins are added yet — only that the payment
        // step finished on ZapUPI's side. Real credit happens server-side
        // once our webhook receives confirmation from ZapUPI.
        statusBox.innerHTML = gzaSpinner("Please wait, verifying and crediting your wallet...");
        pollDepositStatus(orderId, statusBox);
      },
      onFailure: function(reason){
        gzaDebugLog("ZapUPI onFailure fired. reason="+JSON.stringify(reason));
        statusBox.innerHTML = `<p style="color:#ef7479">Payment failed or cancelled. No coins were deducted.</p>`;
      }
    });

    // STEP 3: create the ZapUPI order (this returns a payment URL/QR page)
    gzaDebugLog("STEP2: calling ZapUPI.createOrder with order_id="+orderId+" amount="+amount);
    ZapUPI.createOrder(
      {
        zap_key: "zapc32f6207bdac8784f4429b9dae40934b",
        order_id: orderId,
        amount: String(amount)
      },
      {
        onResponse: function(paymentUrl, returnedOrderId, respData){
          gzaDebugLog("ZapUPI onResponse fired. paymentUrl="+paymentUrl+" returnedOrderId="+returnedOrderId+" respData="+JSON.stringify(respData));
          ZapUPI.loadPayment(paymentUrl); // opens the fullscreen QR/payment page
        },
        onError: function(err){
          gzaDebugLog("ZapUPI onError fired: "+JSON.stringify(err));
          statusBox.innerHTML = `<p style="color:#ef7479">Could not start payment: ${err}</p>`;
        }
      }
    );

  } catch (err) {
    console.error(err);
    gzaDebugLog("EXCEPTION in startDeposit: "+(err?.message||err));
    statusBox.innerHTML = `<p style="color:#ef7479">Something went wrong. Please try again.</p>`;
  }
}

// Polls our backend (which reflects the webhook result) until the deposit
// is confirmed, failed, or flagged — then refreshes the wallet balance.
function pollDepositStatus(orderId, statusBox, attempt){
  attempt = attempt || 0;
  if(attempt > 20){ // ~60s of polling at 3s interval
    statusBox.innerHTML = `<p class="muted">Still verifying — check "My Wallet" in a minute if this doesn't update.</p>`;
    return;
  }
  gzaDebugLog("STEP3: polling order-status, attempt="+attempt+" orderId="+orderId);
  fetch(`${WALLET_API_BASE}/order-status/${orderId}`)
    .then(r => r.json())
    .then(async data => {
      gzaDebugLog("order-status response: "+JSON.stringify(data));
      if(!data.success){
        statusBox.innerHTML = `<p style="color:#ef7479">Could not verify order.</p>`;
        return;
      }
      if(data.orderStatus === "completed"){
        localStorage.removeItem("gza_pending_deposit");
        statusBox.innerHTML = `<p style="color:#22a45b">✅ ${data.amount} coins added to your wallet!</p>`;
        try{
          const freshUser=await db.ref("users/"+currentUser.uid).once("value");
          const freshCoins=Number(freshUser.val()?.coins||0);
          if(cache.users?.[currentUser.uid]) cache.users[currentUser.uid].coins=freshCoins;
          await db.ref("coinTransactions").push({
            uid:currentUser.uid,type:"deposit",amount:Number(data.amount||0),
            balanceAfter:freshCoins,orderId, status:"completed",createdAt:Date.now()
          });
        }catch(logErr){console.warn("Deposit history log failed:",logErr);}
        gzaNotify(`${data.amount} coins added to your wallet.`,"success");
        setTimeout(()=>wallet(), 1200);
      } else if(data.orderStatus === "failed" || data.orderStatus === "mismatch"){
        localStorage.removeItem("gza_pending_deposit");
        statusBox.innerHTML = `<p style="color:#ef7479">Payment could not be verified. If money was deducted, contact support with order ID: ${orderId}</p>`;
      } else {
        setTimeout(()=>pollDepositStatus(orderId, statusBox, attempt+1), 3000);
      }
    })
    .catch((e)=>{ gzaDebugLog("order-status fetch FAILED: "+(e?.message||e)); setTimeout(()=>pollDepositStatus(orderId, statusBox, attempt+1), 3000); });
}

async function submitWithdrawal(ev){
  ev.preventDefault();
  if(!currentUser){alert("Please login to continue.");return;}
  const uid=String(currentUser.uid);
  /* GEN Z ARENA FIX: minWithdraw/maxWithdraw were only declared inside withdrawalInfo()
     and were not in scope here, so this whole function threw a silent ReferenceError
     the moment Submit was clicked — nothing happened and no alert ever showed. */
  const withdrawSettings=(cache.settings&&cache.settings.withdraw)||{};
  const minWithdraw=Math.max(1,Number(withdrawSettings.min||50));
  const maxWithdraw=Math.max(minWithdraw,Number(withdrawSettings.max||10000));
  const amount=Number(document.getElementById("wdAmount")?.value||0);
  const method=document.getElementById("wdMethod")?.value||"";
  const winningTotal=getWinningTotal(uid);
  const requests=getMyWithdrawalRequests(uid);
  const reserved=requests.filter(r=>!["rejected","cancelled","canceled"].includes(statusNorm(r.status))).reduce((s,r)=>s+Number(r.amount||0),0);
  const available=Math.max(0,winningTotal-reserved);
  if(!amount||amount<1){alert("Please enter a valid withdrawal amount.");return;}
  if(amount<minWithdraw){alert(`Minimum withdrawal amount is ${minWithdraw} coins.`);return;}
  if(amount>maxWithdraw){alert(`Maximum withdrawal amount is ${maxWithdraw} coins.`);return;}
  if(amount>available){alert(`Maximum available winning amount is ${available} coins.`);return;}
  if(!method){alert("Please select a withdrawal method.");return;}

  const methodLabel={bank:"Bank Account",upi:"UPI ID",gpay:"Google Pay",phonepe:"PhonePe",redeem:"Redeem Code"}[method]||method;
  const details={};
  if(method==="bank"){
    details.accountHolder=String(document.getElementById("wdName")?.value||"").trim();
    details.accountNumber=String(document.getElementById("wdAccount")?.value||"").trim();
    details.ifsc=String(document.getElementById("wdIfsc")?.value||"").trim().toUpperCase();
    if(!details.accountHolder||!details.accountNumber||!details.ifsc){alert("Please fill all bank details.");return;}
  }else if(method==="upi"||method==="gpay"||method==="phonepe"){
    details.upiId=String(document.getElementById("wdUpi")?.value||"").trim();
    details.holderName=String(document.getElementById("wdName")?.value||"").trim();
    if(!details.upiId||!details.holderName){alert("Please fill the UPI details.");return;}
  }else if(method==="redeem"){
    details.redeemCode=String(document.getElementById("wdRedeem")?.value||"").trim();
    if(!details.redeemCode){alert("Please enter the redeem code/details.");return;}
  }

  const requestId="WD"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase();
  const payload={
    requestId,uid,userId:uid,
    userName:String(currentUserData().name||currentUser.displayName||"User"),
    email:String(currentUser.email||""),
    amount,method,methodLabel,details,
    status:"submitted",createdAt:Date.now(),updatedAt:Date.now()
  };

  /* GEN Z ARENA FIX: submitting a withdrawal request used to only write a
     row into withdrawalRequests — it never touched users/{uid}/coins, so
     the wallet balance shown everywhere (header coin-box, join screen)
     stayed exactly the same and the same coins could still be spent on
     joining another match while the withdrawal was pending. We now
     atomically debit the requested amount from the wallet at submit time,
     the same way confirmJoin() debits an entry fee, so the coins are
     actually reserved the moment the request goes in. */
  let debited=false;
  try{
    const walletRef=db.ref("users/"+uid+"/coins");
    const tx=await walletRef.transaction(currentCoins=>{
      const n=Number(currentCoins||0);
      if(n<amount)return;
      return n-amount;
    });
    if(!tx.committed){
      alert("Your wallet balance changed just now. Please re-check the amount and try again.");
      return;
    }
    debited=true;
    const newBalance=Number(tx.snapshot.val()||0);
    if(cache.users?.[uid]) cache.users[uid].coins=newBalance;

    await db.ref("withdrawalRequests").push(payload);
    await db.ref("coinTransactions").push({
      uid,type:"withdrawal",amount:-amount,balanceAfter:newBalance,
      requestId,method,methodLabel,status:"submitted",createdAt:payload.createdAt
    });
    alert("Withdrawal request submitted successfully. "+amount+" coins have been deducted from your wallet. Status: SUBMITTED.");
    withdrawalInfo();
  }catch(e){
    console.error("Withdrawal request error",e);
    // If the coins were debited but the request record failed to save, refund exactly what was taken.
    if(debited){
      try{
        const walletRef=db.ref("users/"+uid+"/coins");
        await walletRef.transaction(currentCoins=>Number(currentCoins||0)+amount);
        if(cache.users?.[uid]) cache.users[uid].coins=Number(cache.users[uid].coins||0)+amount;
      }catch(refundError){
        console.error("Withdrawal refund failed:",refundError);
      }
    }
    alert("Withdrawal request could not be submitted. Please try again.");
  }
}

async function saveProfile(){
  if(!currentUser){alert("Please login to continue.");return;}
  const name=document.getElementById("profileName")?.value.trim()||"";
  const ign=document.getElementById("profileIgn")?.value.trim()||"";
  const gameUid=document.getElementById("profileUid")?.value.trim()||"";
  const msg=document.getElementById("profileSaveMsg");
  if(!name||!ign||!gameUid){if(msg)msg.textContent="Please fill Name, In Game Name and Game UID.";return;}
  const btn=document.getElementById("saveProfileBtn");
  if(btn){btn.disabled=true;btn.textContent="Saving...";}
  try{
    const updates={name:name,ign:ign,uidGame:gameUid,inGameName:ign,inGameUid:gameUid,gameUid:gameUid,updatedAt:Date.now()};
    await db.ref("users/"+currentUser.uid).update(updates);
    if(!cache.users)cache.users={};
    cache.users[currentUser.uid]={...(cache.users[currentUser.uid]||{}),...updates};
    gzaNotify("Profile saved successfully.","success");
    profile();
  }catch(e){
    console.error(e);
    if(btn){btn.disabled=false;btn.textContent="💾 SAVE";}
    const msg=document.getElementById("profileSaveMsg");
    if(msg)msg.textContent="We could not save your profile right now. Please try again.";
    if(btn){btn.disabled=false;btn.textContent="💾 SAVE";}
  }
}

function support(){
  /* GEN Z ARENA FIX: this used to read only 4 exact field names
     (supportNumber/supportPhone/supportLink/supportUrl) out of
     "settings". If the admin panel saved Customer Support details under
     any other name, or under a separate "support" node, nothing showed
     up here even though the admin had updated it. We now merge both
     "settings" and "support", and pick up ANY field whose name contains
     "support" (case-insensitive) so an admin update always reaches the
     user — whatever the admin panel happens to call it — plus we still
     recognise the original field names and a WhatsApp/email/message. */
  const merged={...(cache.settings||{}),...(cache.support||{})};
  const isUrl=v=>/^https?:\/\//i.test(String(v||"").trim());
  const isPhone=v=>/^[+0-9][0-9\s-]{6,}$/.test(String(v||"").trim());

  let number=merged.supportNumber||merged.supportPhone||merged.supportWhatsapp||merged.whatsapp||"";
  let link=merged.supportLink||merged.supportUrl||merged.supportWebsite||"";
  let email=merged.supportEmail||merged.email||"";
  let message=merged.supportMessage||merged.supportText||merged.supportDetails||merged.supportNote||merged.message||"";
  const extras=[];

  Object.keys(merged).forEach(k=>{
    if(!/support/i.test(k))return;
    const v=merged[k];
    if(v==null||typeof v==="object")return;
    const val=String(v).trim();
    if(!val)return;
    if(isPhone(val)){ if(!number) number=val; return; }
    if(isUrl(val)){ if(!link) link=val; return; }
    if(/@/.test(val) && !email){ email=val; return; }
    if(val!==message && !extras.includes(val)) extras.push(val);
  });

  document.getElementById("app").innerHTML=`
    ${innerHeader("Contact Support")}
    <div class="simple-page">
      <div class="simple-card">
        <h3>☎️ Customer Support</h3>
        <p style="margin-top:10px">For app-related help, contact the support details shown here.</p>
        ${message?`<p style="margin-top:12px;line-height:1.6">${esc(message)}</p>`:""}
        ${extras.map(t=>`<p style="margin-top:8px;line-height:1.6">${esc(t)}</p>`).join("")}
        ${number?`<button class="primary-join" onclick="location.href='tel:${esc(number)}'">CALL SUPPORT</button>`:""}
        ${email?`<button class="primary-join" style="margin-top:8px" onclick="location.href='mailto:${esc(email)}'">EMAIL SUPPORT</button>`:""}
        ${link?`<button class="primary-join" style="margin-top:8px" onclick="window.open('${esc(link)}','_blank','noopener')">OPEN SUPPORT</button>`:""}
        ${!number&&!link&&!email&&!message&&!extras.length?`<p class="muted" style="margin-top:12px">Support details have not been published yet.</p>`:""}
      </div>
    </div>
    ${bottom()}
  `;
}

/* ---------------- Realtime render ---------------- */

function renderCurrent(){
  const app=document.getElementById("app");
  if(!app)return;

  if(!currentUser){
    showAuth("login");
    return;
  }

  /* Keep the exact screen that the user was viewing. Firebase listeners
     can call renderCurrent() after a browser reload; never force Home when
     another route is already restored. */
  const route=gzaRouteStack?.[gzaRouteStack.length-1];
  if(route && route.name && route.name!=="home" && !gzaHistoryNavigatingBack){
    try{
      const fn=window[route.name];
      if(fn?.__gzaOriginal){
        fn.__gzaOriginal.apply(window,route.args||[]);
        return;
      }
    }catch(_){ }
  }

  if(currentTournament && document.querySelector(".details-page")){
    const fn=window.details;
    if(fn?.__gzaOriginal)fn.__gzaOriginal.call(window,currentTournament.id);
    else details(currentTournament.id);
    return;
  }

  if(currentCategoryId && document.querySelector(".tabs")){
    renderCategory();
    return;
  }

  /* Firebase data can arrive after Home is first painted. */
  if(document.querySelector(".topbar")){
    const fn=window.home;
    if(fn?.__gzaOriginal)fn.__gzaOriginal.call(window);
    else home();
    return;
  }

  if(!document.querySelector(".bottom-nav")){
    const fn=window.home;
    if(fn?.__gzaOriginal)fn.__gzaOriginal.call(window);
    else home();
  }
}

/* ---------------- Android / phone back navigation ----------------
   Each major User Panel screen gets a browser-history entry. The phone
   back button therefore moves exactly one app screen back instead of
   closing the page immediately. Direct header back buttons use the same
   history route. Refresh keeps the current page as the browser's first
   entry without creating an infinite loop.
-------------------------------------------- */
let gzaHistoryReady=false;
let gzaHistoryNavigatingBack=false;
let gzaRouteStack=[];
function gzaRouteKey(name,args){
  try{return name+"|"+JSON.stringify(args||[]);}catch(_){return name;}
}
function gzaStartAtHome(){
  // Every fresh app/page open starts at Home. Do not restore a previous inner screen.
  try{localStorage.removeItem("gza_last_route");}catch(_){}
  gzaHistoryReady=true;
  gzaHistoryNavigatingBack=false;
  const homeFn=window.home?.__gzaOriginal || window.home;
  if(typeof homeFn!=="function")return;
  const route={name:"home",args:[],key:gzaRouteKey("home",[])};
  gzaRouteStack=[route];
  try{history.replaceState({gza:true,index:0},"",location.href);}catch(_){}
  gzaResetScroll();
  homeFn.apply(window,[]);
  requestAnimationFrame(gzaResetScroll);
}
function gzaResetScroll(){
  try{window.scrollTo({top:0,left:0,behavior:"auto"});}catch(_){try{window.scrollTo(0,0);}catch(__){}}
  try{document.documentElement.scrollTop=0;document.body.scrollTop=0;}catch(_){}
  try{document.querySelectorAll("[data-scroll-container], .gza-contest-list, .simple-page, .page, .tournament-list, .details-page, .position-page, .selected-page, .game-details-page, .leader-page, .subscription-page").forEach(el=>{if(el.scrollTop)el.scrollTop=0;});}catch(_){}
}
function gzaPushRoute(name,args,original){
  const key=gzaRouteKey(name,args);
  const last=gzaRouteStack[gzaRouteStack.length-1];
  if(!gzaHistoryReady){
    gzaHistoryReady=true;
    gzaRouteStack=[{name,args,key}];
    gzaSaveCurrentRoute();
    gzaResetScroll();
    original.apply(window,args||[]);
    requestAnimationFrame(gzaResetScroll);
    return;
  }
  if(gzaHistoryNavigatingBack){
    gzaResetScroll();
    original.apply(window,args||[]);
    requestAnimationFrame(gzaResetScroll);
    return;
  }
  if(last && last.key===key){
    gzaResetScroll();
    original.apply(window,args||[]);
    requestAnimationFrame(gzaResetScroll);
    return;
  }
  gzaRouteStack.push({name,args,key});
  gzaSaveCurrentRoute();
  history.pushState({gza:true,index:gzaRouteStack.length-1},"",location.href);
  gzaResetScroll();
  original.apply(window,args||[]);
  requestAnimationFrame(gzaResetScroll);
}
function gzaBack(){
  if(gzaRouteStack.length>1){history.back();return;}
  try{
    const homeFn=window.home?.__gzaOriginal || originalHomeForHistory || window.home;
    if(typeof homeFn==="function"){
      gzaRouteStack=[{name:"home",args:[],key:gzaRouteKey("home",[])}];
      gzaHistoryReady=true;
      try{history.replaceState({gza:true,index:0},"",location.href);}catch(_){}
      homeFn.apply(window,[]);
    }
  }catch(_){ }
}
function gzaInstallNavigationHistory(){
  const names=["home","category","details","positions","viewAllJoiningPlayers","selected","gameDetails","wallet","deposit","withdrawalInfo","leaderboard","subscription","referral","profile","statistics","menu","notifications","announcements","helpFaq","support","userSettings","policyPage","matchHistory","joinHistoryPage","transactionHistory","myMatches","coupons","earn","simple"];
  names.forEach(name=>{
    const original=window[name];
    if(typeof original!=="function" || original.__gzaWrapped)return;
    if(name==="home")window.originalHomeForHistory=original;
    const wrapped=function(...args){return gzaPushRoute(name,args,original);};
    wrapped.__gzaWrapped=true;
    wrapped.__gzaOriginal=original;
    window[name]=wrapped;
  });
  window.addEventListener("popstate",()=>{
    if(gzaRouteStack.length<=1){
      const first=gzaRouteStack[0];
      if(first){gzaHistoryNavigatingBack=true;try{window[first.name].__gzaOriginal.apply(window,first.args||[]);}finally{gzaHistoryNavigatingBack=false;}}
      return;
    }
    gzaRouteStack.pop();
    const prev=gzaRouteStack[gzaRouteStack.length-1];
    if(!prev)return;
    gzaHistoryNavigatingBack=true;
    try{
      gzaResetScroll();
      const fn=window[prev.name];
      if(fn?.__gzaOriginal)fn.__gzaOriginal.apply(window,prev.args||[]);
      else if(typeof fn==="function")fn.apply(window,prev.args||[]);
      requestAnimationFrame(gzaResetScroll);
    }finally{gzaHistoryNavigatingBack=false;}
  });
}

/* Install wrappers before authentication starts so every screen transition
   is captured, including transitions triggered from Firebase callbacks. */
gzaInstallNavigationHistory();

// Mobile pull-down refresh: only triggers when the page is already at the top.
(function installPullRefresh(){
  let startY=0,tracking=false;
  document.addEventListener("touchstart",e=>{
    if(window.scrollY<=0 && e.touches?.length===1){startY=e.touches[0].clientY;tracking=true;}
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!tracking||!e.touches?.length)return;
    if(e.touches[0].clientY-startY>85){tracking=false;refreshApp(null);}
  },{passive:true});
  document.addEventListener("touchend",()=>{tracking=false;},{passive:true});
})();

startListeners();
startAuth();
</script>
